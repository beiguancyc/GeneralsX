# GeneralsX macOS DXVK runtime configuration
#
# Keep sampler-type spec constants disabled by default.
# This setting is part of our macOS terrain shader stability baseline.
# DXVK source-of-truth is maintained in the fbraz3 fork branch.

d3d9.forceSamplerTypeSpecConstants = False

# GeneralsX @bugfix Codex 27/10/2026 Limit D3D9 frames in flight so mouse
# feedback is not delayed by DXVK's default three-frame present queue.
d3d9.maxFrameLatency = 1

# GeneralsX @bugfix fbraz3 12/10/2026 Disable strict D3D9 losable resource accounting across device reset.
# In D3D8, swapchain resets (such as macOS fullscreen transitions and window resizing)
# do not require exhaustive destruction of all D3DPOOL_DEFAULT subresources.
d3d9.countLosableResources = False
